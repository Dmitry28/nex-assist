version: 2

# Every update must land on `dev` first and reach `main` only through a release PR.
# Without `target-branch` Dependabot opens PRs against the default branch (`main`), which
# bypasses the release flow and conflicts with the `dev -> main` merge — that is why #324
# was closed rather than merged.
updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Groups are split by update-type on purpose. Batching majors together with patches
    # produced PRs that could not be merged at all: #446 buried typescript 5.9 -> 7.0 among
    # ten patch bumps, and #447 buried puppeteer 24 -> 25 (which breaks jest's ESM handling)
    # next to a harmless helmet bump. A major now arrives on its own, so it can be evaluated
    # without holding the routine updates hostage.
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors change type-checking semantics across the whole codebase; move on it
      # deliberately, not because a bot opened a PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    # The Node major is pinned to whatever `.nvmrc` says, so CI, local dev and the image stay
    # on one version. Dependabot proposed 24 -> 26 while `.nvmrc` said 24, which would have
    # split them; bump both together when moving to a new LTS instead.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: chore
