name: Daily Land Scrape

# TODO: this workflow is a temporary workaround — see src/modules/land-auctions/_TODO.md
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC (10:00 Minsk time, UTC+3)
  workflow_dispatch:
    inputs:
      send_all_mosty_jobs:
        description: 'One-off: send ALL snapshot vacancies to the mosty-jobs chat instead of scraping'
        type: boolean
        default: false
      send_all_sources:
        description: 'Optional comma-separated source filter for send-all (e.g. joblab,kufar)'
        type: string
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache Puppeteer browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: |
          npx puppeteer browsers install chrome
          # Export the installed Chrome path so rebrowser-puppeteer uses it instead of
          # its bundled version (rebrowser-puppeteer@24.8.1 bundles a different Chrome
          # version than puppeteer@25.x, so we point it at the already-downloaded binary).
          #
          # `node -p` is not safe here: puppeteer 25 made executablePath() return a Promise, so
          # it printed a two-line `Promise { '/path' }` dump and $GITHUB_ENV rejected the
          # multi-line value, failing the whole run before a single site was scraped. Awaiting
          # the value and writing it raw works whether the function returns a string or a
          # promise, so the next major cannot break the run this way again.
          echo "PUPPETEER_EXECUTABLE_PATH=$(node -e "Promise.resolve(require('puppeteer').executablePath()).then(p => process.stdout.write(p))")" >> $GITHUB_ENV

      - name: Send all mosty-jobs vacancies (one-off)
        if: inputs.send_all_mosty_jobs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_MOSTY_JOBS_CHAT_ID: ${{ vars.TELEGRAM_MOSTY_JOBS_CHAT_ID }}
          SEND_ALL_SOURCES: ${{ inputs.send_all_sources }}
        run: npx ts-node -r tsconfig-paths/register src/scripts/mosty-jobs-send-all.ts

      - name: Run scrape
        if: ${{ !inputs.send_all_mosty_jobs }}
        env:
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_LAND_AUCTIONS_CHAT_ID: ${{ vars.TELEGRAM_LAND_AUCTIONS_CHAT_ID }}
          TELEGRAM_BID_CARS_CHAT_ID: ${{ vars.TELEGRAM_BID_CARS_CHAT_ID }}
          TELEGRAM_KUFAR_CHAT_ID: ${{ vars.TELEGRAM_KUFAR_CHAT_ID }}
          TELEGRAM_KUFAR_RENT_FLAT_CHAT_ID: ${{ vars.TELEGRAM_KUFAR_RENT_FLAT_CHAT_ID }}
          TELEGRAM_KUFAR_RENT_LONG_CHAT_ID: ${{ vars.TELEGRAM_KUFAR_RENT_LONG_CHAT_ID }}
          TELEGRAM_REALT_CHAT_ID: ${{ vars.TELEGRAM_REALT_CHAT_ID }}
          TELEGRAM_AV_BY_CHAT_ID: ${{ vars.TELEGRAM_AV_BY_CHAT_ID }}
          TELEGRAM_POGORANY_CHAT_ID: ${{ vars.TELEGRAM_POGORANY_CHAT_ID }}
          TELEGRAM_MOSTY_JOBS_CHAT_ID: ${{ vars.TELEGRAM_MOSTY_JOBS_CHAT_ID }}
          TELEGRAM_ATLAS_PARTS_CHAT_ID: ${{ vars.TELEGRAM_ATLAS_PARTS_CHAT_ID }}
          TELEGRAM_GHB_CHAT_ID: ${{ vars.TELEGRAM_GHB_CHAT_ID }}
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}
        run: npm run scrape

      - name: Commit updated snapshots via PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping PR"
            exit 0
          fi
          # dev and main are two environments, each with its own chats and its own snapshots,
          # so both persist. The data therefore diverges by design and a `dev -> main` release
          # merge will conflict across data/: resolve it by keeping the TARGET branch's data,
          # never by taking the source's, or you roll that environment's state back.
          DATE=$(date '+%Y-%m-%d')
          BRANCH="chore/data-${DATE}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore: update scraped data [${DATE}]"
          git push origin "$BRANCH"
          BASE_BRANCH="${GITHUB_REF_NAME}"
          PR_URL=$(gh pr create \
            --title "chore: update scraped data [${DATE}]" \
            --body "Automated data update from daily scrape workflow." \
            --base "$BASE_BRANCH" \
            --head "$BRANCH")
          gh pr merge "$PR_URL" --merge --auto
