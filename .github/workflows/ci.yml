name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Check outdated packages
        run: npm outdated || true

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:ci

      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests

      - name: Dead code check
        run: npm run check:dead-code

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      # A merge that leaves conflict markers inside data/*.json is not a syntax error anywhere
      # the other checks look, so it reaches production intact. There the snapshot loader spots
      # the invalid JSON, resets the file and re-baselines the feed — silently, because a
      # baseline suppresses per-listing messages. That happened on 04.08: 34 feeds reset at once
      # and their history was lost. Parsing the files here is the cheap way to never repeat it.
      - name: Validate snapshots
        run: |
          fail=0
          for f in data/*.json; do
            if grep -qE '^(<<<<<<<|>>>>>>>|=======)$' "$f"; then
              echo "::error file=$f::unresolved merge conflict markers"
              fail=1
            elif ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done
          exit $fail
